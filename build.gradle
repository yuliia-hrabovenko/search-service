buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'jacoco'
    id 'checkstyle'
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.6"
    id "org.openapi.generator" version "6.6.0"
    id "com.google.protobuf" version "0.9.4"
}

allprojects {
    apply plugin: 'java'

    group = 'net.guzari.search'

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    repositories {
        mavenCentral()
    }

    ext.springBootVersion = '2.7.14'
    ext.springDependencyManagement = '1.0.15.RELEASE'

    ext.libVersions = [
            springBoot            : "${springBootVersion}",
            lombok                : "1.18.20",
            mapstruct             : "1.5.2.Final",
            lombokMapstructBinding: "0.2.0",
            openapiCommon         : '1.7.0',
            databindNullable      : '0.2.4',
            javaxAnnotation       : '1.3.2',
            javaxServlet          : '4.0.1',
    ]

    ext.libs = [
            logging        : ["ch.qos.logback:logback-classic",
                              "org.codehaus.janino:janino"],
            javaxAnnotation: "javax.annotation:javax.annotation-api:${libVersions.javaxAnnotation}",
            javaxServlet   : "javax.servlet:javax.servlet-api:${libVersions.javaxServlet}",
            unitTest       : ["org.junit.jupiter:junit-jupiter-api",
                              "org.junit.jupiter:junit-jupiter-params",
                              "org.junit.jupiter:junit-jupiter-engine",
                              "org.assertj:assertj-core",
                              "org.mockito:mockito-core",
                              "org.mockito:mockito-inline",
                              "org.mockito:mockito-junit-jupiter"],
            openapi        : ["org.springdoc:springdoc-openapi-common:${libVersions.openapiCommon}",
                              "org.openapitools:jackson-databind-nullable:${libVersions.databindNullable}"],
    ]

    dependencies {
        implementation platform("org.springframework.boot:spring-boot-dependencies:${libVersions.springBoot}")

        implementation "org.mapstruct:mapstruct:${libVersions.mapstruct}"
        annotationProcessor "org.mapstruct:mapstruct-processor:${libVersions.mapstruct}"

        annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${libVersions.lombokMapstructBinding}"
        compileOnly "org.projectlombok:lombok:${libVersions.lombok}"
        annotationProcessor "org.projectlombok:lombok:${libVersions.lombok}"
        testCompileOnly "org.projectlombok:lombok:${libVersions.lombok}"
        testAnnotationProcessor "org.projectlombok:lombok:${libVersions.lombok}"
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
    }
}

subprojects.findAll {

    checkstyle {
        sourceSets = [project.sourceSets.main, project.sourceSets.test] as Collection<SourceSet>

        ignoreFailures = false
        maxWarnings = 0
        showViolations = true
    }
}